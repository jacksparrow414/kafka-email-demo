services:
  kafka:
    image: apache/kafka:4.2.1
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9095:9095"
    volumes:
      - type: volume
        source: kafka_data
        target: /var/lib/kafka/data
        read_only: false
      - type: bind
        source: ./jmx_prometheus_javaagent-1.6.0.jar
        target: /mnt/shared/jmx/jmx_prometheus_javaagent-1.6.0.jar
        read_only: true
      - type: bind
        source: ./kafka-kraft-3_0_0.yml
        target: /mnt/shared/jmx/kafka-jmx-exporter.yml
        read_only: true
      - type: bind
        source: ./monitoring/client-metrics-reporter.jar
        target: /opt/kafka/libs/client-metrics-reporter.jar
        read_only: true
      - type: bind
        source: ./monitoring/client-metrics-reporter-config.yml
        target: /mnt/shared/config/client-metrics-reporter-config.yml
        read_only: true
    environment:
      - KAFKA_HEAP_OPTS=-Xmx2048m -Xms2048m
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=CONTROLLER://:9094,BROKER://:9092,EXTERNAL://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=BROKER://kafka:9092,EXTERNAL://localhost:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=BROKER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9094
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      # KIP-714: 注册客户端指标reporter插件, 将客户端遥测指标转发到otel-collector
      - KAFKA_METRIC_REPORTERS=com.instaclustr.kafka.KafkaClientMetricsReporter
      - KAFKA_CLIENT_METRICS_CONFIG_PATH=/mnt/shared/config/client-metrics-reporter-config.yml
      # JMX remote，供 kafka-ui 抓取基础指标（容器网络内）
      - JMX_PORT=9998
      - KAFKA_JMX_OPTS=-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=kafka -Dcom.sun.management.jmxremote.rmi.port=9998
      # 集成Prometheus JMX Exporter 1.6.0
      - KAFKA_OPTS=-javaagent:/mnt/shared/jmx/jmx_prometheus_javaagent-1.6.0.jar=9095:/mnt/shared/jmx/kafka-jmx-exporter.yml
    # 限制容器整体使用4G内存
    deploy:
      resources:
        limits:
          memory: 4G
  apicurio-registry:
    container_name: apicurio-registry
    image: apicurio/apicurio-registry:3.3.1
    ports:
      # web console与REST API都在8080端口, 映射到宿主机8081避免与Tomcat冲突
      # web console: http://localhost:8081, REST API: http://localhost:8081/apis/registry/v3
      - "8081:8080"
    depends_on:
      - kafka
    # 首次启动时若kafkasql topic刚创建完成可能因UnknownTopicOrPartition退出, 自动重启即可恢复
    restart: on-failure
    environment:
      # schema存储到kafka中(kafkasql存储), 数据保存在kafka的kafkasql-journal topic里
      - APICURIO_STORAGE_KIND=kafkasql
      - APICURIO_KAFKASQL_BOOTSTRAP_SERVERS=kafka:9092
      # web console是浏览器端SPA, 会直接跨域调用API, 放开CORS
      - QUARKUS_HTTP_CORS_ORIGINS=*
      # 允许通过REST API/web console删除artifact(默认禁用)
      - APICURIO_REST_DELETION_ARTIFACT_ENABLED=true
      # 允许删除空group(默认禁用)
      - APICURIO_REST_DELETION_GROUP_ENABLED=true
  apicurio-registry-ui:
    container_name: apicurio-registry-ui
    image: apicurio/apicurio-registry-ui:3.3.1
    ports:
      # web console: http://localhost:8082
      - "8082:8080"
    depends_on:
      - apicurio-registry
    environment:
      # SPA在浏览器中运行, 该URL必须是浏览器可达的地址, 即API的宿主机映射地址
      - REGISTRY_API_URL=http://localhost:8081/apis/registry/v3
  kafka-ui:
    container_name: kafka-ui
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "9080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-stand-alone
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9998
      # 接入Apicurio Registry(其Confluent兼容端点), 使消息列表能把Avro value反序列化显示
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://apicurio-registry:8080/apis/ccompat/v7
      # 默认value反序列化器设为SchemaRegistry, 打开消息列表即按Avro解码(否则默认String需手动切换)
      KAFKA_CLUSTERS_0_DEFAULTVALUESERDE: SchemaRegistry
      SERVER_SERVLET_CONTEXT_PATH: /kafkaui
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: adb-1234
      DYNAMIC_CONFIG_ENABLED: 'true'
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.155.0
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - type: bind
        source: ./monitoring/otel-collector-config.yml
        target: /etc/otel-collector-config.yml
        read_only: true
    depends_on:
      - kafka
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - type: bind
        source: ./monitoring/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: volume
        source: prometheus_data
        target: /prometheus
        read_only: false
    depends_on:
      - otel-collector
  grafana:
    container_name: grafana
    image: grafana/grafana:13.0.1
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - type: bind
        source: ./monitoring/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ./monitoring/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
      - type: volume
        source: grafana_data
        target: /var/lib/grafana
        read_only: false
    depends_on:
      - prometheus
volumes:
  kafka_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
