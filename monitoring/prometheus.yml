global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # broker JMX 指标 (jmx_prometheus_javaagent)
  - job_name: kafka-jmx
    static_configs:
      - targets: ['kafka:9095']
        labels:
          component: 'broker'

  # 客户端遥测指标 (KIP-714, 经由 otel-collector 的 prometheus exporter)
  - job_name: kafka-client-telemetry
    static_configs:
      - targets: ['otel-collector:9464']
        labels:
          component: 'client'
